[package]
name = "marvii-name-forwarder"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A NEAR name's deposit address: forwards everything it receives to one Marvii wallet, set once, with no keys and no way to change it"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
