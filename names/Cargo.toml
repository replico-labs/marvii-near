[package]
name = "marvii-names"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Marvii names on NEAR: a wallet registers one name, e.g. alice.marvii.testnet, which becomes a keyless deposit address forwarding to it"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
