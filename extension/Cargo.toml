[package]
name = "marvii-session-extension"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Session keys with on-chain limits for defuse-wallet: agents act within venues and daily caps, on NEAR and through Chain Signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# The wallet's own request types, so the call to w_execute_extension is
# encoded exactly as the wallet expects. Pinned to the commit we built and
# read (near/intents at 32cd1f9, 4 November 2026).
defuse-wallet = { git = "https://github.com/near/intents", rev = "32cd1f9788a347908164fbcc56525dc6542f158f", default-features = false, features = ["std", "serde", "json"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
