[package]
name = "marvii-outlayer-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Marvii demo agent's signing key, held inside an OutLayer TEE (Intel TDX)"

[[bin]]
name = "marvii-outlayer-agent"
path = "src/main.rs"

[dependencies]
# Bindings for OutLayer's signing-key host functions, from wit/signing-keys.wit
# (a copy of OutLayer's, MIT OR Apache-2.0).
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
